name: OIA integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oia-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen Track A 003a package
        run: python scripts/verify_track_a_003a.py

      - name: Verify imported Track A 003b evidence
        run: python scripts/verify_track_a_003b_evidence.py

      - name: Verify Track A 003b inventory and next-gate pins
        run: python scripts/verify_track_a_003b_inventory.py

      - name: Verify Track A 003b pre-outcome runtime freeze
        run: python scripts/verify_track_a_003b_preoutcome.py

      - name: Verify Track A 003b candidate-admission outcome
        run: python scripts/verify_track_a_003b_outcome.py

      - name: Verify Track A 004a retrospective pre-run freeze
        run: python scripts/verify_track_a_004a_prerun.py

      - name: Verify Track A 004a retrospective outcome when present
        run: python scripts/verify_track_a_004a_outcome.py

      - name: Verify Track A 005a held-out source freeze
        run: python scripts/verify_track_a_005a_source_freeze.py

      - name: Verify Track A 005a source selection when present
        run: python scripts/verify_track_a_005a_selection.py

      - name: Verify Track A 005a P0 freeze and extraction when present
        run: python scripts/verify_track_a_005a_p0.py

      - name: Verify Track A 005a candidate-generation freeze
        run: python scripts/verify_track_a_005a_generation_freeze.py

      - name: Verify Track A 005a candidate-generation result when present
        run: |
          sha256sum -c audits/track-a-005a/GENERATION_RESULT_SHA256SUMS.txt
          python scripts/verify_track_a_005a_generation_result.py

      - name: Verify Track A 005a behavior/OIA preexecution freeze
        run: python scripts/verify_track_a_005a_preexecution.py

      - name: Verify Track A 005a behavior/OIA outcome when present
        run: python scripts/verify_track_a_005a_behavior_outcome.py

      - name: Verify Track A 005a archival-outcome freeze
        run: python scripts/verify_track_a_005a_archive_outcome_freeze.py

      - name: Verify Track A 005a archival outcome when present
        run: python scripts/verify_track_a_005a_archive_outcome.py

      - name: Verify Track A 005a prediction-error diagnostic freeze
        run: python scripts/verify_track_a_005a_prediction_diagnostic_freeze.py

      - name: Verify Track A 005a prediction-error diagnostic when present
        run: python scripts/verify_track_a_005a_prediction_diagnostic.py

      - name: Verify Track A 005b intervention-revision freeze
        run: python scripts/verify_track_a_005b_revision_freeze.py

      - name: Verify Track A 005b revision-generation result when present
        run: python scripts/verify_track_a_005b_generation_result.py

      - name: Verify Track A 005b behavior/OIA outcome when present
        run: python scripts/verify_track_a_005b_behavior_outcome.py

      - name: Verify Track A 005c missing-import maintenance freeze
        run: python scripts/verify_track_a_005c_freeze.py

      - name: Verify Track A 005c normalization result when present
        run: python scripts/verify_track_a_005c_normalization_result.py

      - name: Verify Track A 005c behavior/OIA outcome when present
        run: python scripts/verify_track_a_005c_behavior_outcome.py

      - name: Verify Track A 005d prospective step-2 outcome freeze
        run: python scripts/verify_track_a_005d_freeze.py

      - name: Verify Track A 005d step-2 outcome when present
        run: python scripts/verify_track_a_005d_outcome.py

      - name: Verify historical freezes and current artifact continuity
        run: python scripts/verify_historical_freeze_continuity.py

      - name: Verify Tycho trace integration pins and boundaries
        run: python scripts/verify_tycho_trace_integration.py

      - name: Verify Tycho local-Qwen qualification and action attribution
        run: python scripts/verify_tycho_local_qwen_qualification.py

      - name: Verify Tycho local-Qwen explicit-action smoke boundary
        run: python scripts/verify_tycho_local_qwen_action_selection.py

      - name: Verify Tycho local-Qwen final commit-only smoke boundary
        run: python scripts/verify_tycho_local_qwen_final_commit.py

      - name: Verify Tycho local-Qwen evaluator-package R0 boundary
        run: python scripts/verify_tycho_kaggle_package.py

      - name: Verify Tycho Docker-free Sandlock R1 boundary
        run: python scripts/verify_tycho_sandlock.py

      - name: Verify Tycho target-preflight R2a package boundary
        run: python scripts/verify_tycho_target_preflight_package.py

      - name: Verify Track A 006b reject-aware outcome when present
        run: python scripts/verify_track_a_006b_outcome.py

      - name: Verify Track A 006c sequential-fusion outcome when present
        run: python scripts/verify_track_a_006c_outcome.py

      - name: Verify accepted v0.2.1 baseline bytes and provenance
        working-directory: baseline/oia-v0.2.1
        run: |
          sha256sum -c SHA256SUMS
          python maintenance/verify_provenance.py

      - name: Run deterministic unit suite
        env:
          PYTHONPATH: baseline/oia-v0.2.1/src
        run: python -m unittest discover -s baseline/oia-v0.2.1/tests -v

      - name: Run repository utility tests
        run: python -m unittest discover -s tests -v

      - name: Run randomized and serialization validation
        working-directory: baseline/oia-v0.2.1
        env:
          PYTHONPATH: src
        run: |
          python research/randomized_validation.py
          python research/task_loss_validation.py
          python research/scaling_probe.py
          python research/hash_seed_reproducibility.py

      - name: Confirm validation did not mutate tracked evidence
        run: git diff --exit-code
